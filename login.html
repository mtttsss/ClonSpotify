<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENJI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bodylogin">
    <header class="headerlogin">
        <img src = "tenji.png" alt = "logo" class = "logosuperior">
    </header>

    <main class="contenedorlogin">
        
        <section class="caja">
            <h1>Inicia Sesión</h1>

            <form id="formLogin" action="index.html" novalidate>
                <div class="g1">
                    <label for="correo">Dirección de correo electrónico o nombre de usuario</label>

                    //para iniciar con usuario o correo
                    <input type="text" id="correo" placeholder="Correo electrónico o nombre de usuario" autocomplete="username" required>
                    
                    <small id="errorCorreo" class="mensaje-error"></small>
                </div>

                <div class="g1">
                    <label for="password">Contraseña</label>
                    <div class="contenedor-password">
                    <input type="password" id="password" placeholder="Tu contraseña" required>
                  <button type="button" id="btnMostrarClave" class="btn-toggle-clave">
                 🔓
                  </button>
                </div>
                    <small id="errorPassword" class="mensaje-error"></small>

                </div>

                <a href="#" class="olvidolink">¿Olvidaste tu contraseña?</a>

                <button type="submit" class="botonlogin">Iniciar Sesión</button>
            </form>
            
            <hr class="separador">

            <footer class="registro">
                <p>¿No tienes cuenta? <a href="register.html">Regístrate en Tenji</a></p>
            </footer>
        </section>
        
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
