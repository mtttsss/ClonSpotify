<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Spotify</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bodylogin">
    <header class="headerlogin">
        <img src = "tenji.png" alt = "logo" class = "logosuperior">
    </header>

    <main class="contenedorlogin">
        
        <section class="caja">
            <h1>Inicia Sesión</h1>

            <form action="index.html">
                <div class="g1">
                    <label for="correo">Dirección de correo electrónico o nombre de usuario</label>
                    <input type="text" id="correo" placeholder="Correo electrónico o nombre de usuario" required>
                </div>

                <div class="g1">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>

                <a href="#" class="olvidolink">¿Olvidaste tu contraseña?</a>

                <button type="submit" class="botonlogin">Iniciar Sesión</button>
            </form>
            
            <hr class="separador">

            <footer class="registro">
                <p>¿No tienes cuenta? <a href="register.html">Regístrate en Spotify</a></p>
            </footer>
        </section>
        
    </main>
    
</body>
</html>
