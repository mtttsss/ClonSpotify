<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Spotify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bodyregistro">
    <header class="headerregistro">
        <h2>Spotify</h2>
    </header>

    <main class="contenedorregistro">
        
        <section class="cajaRegister"> 
            <h1>Regístrate gratis para empezar a escuchar musica</h1>

            <form action="index.html">
                <div class="g1">
                    <label for="correo">Direccion de correo electronico</label>
                    <input type="email" id="correo" placeholder="nombre@gmail.com" required>
                </div>

                <div class="g1">
                    <label for="password">Crea una contraseña</label>
                    <input type="password" id="password" placeholder="Ejemplo: Spotify123!" minlength="8" required>
                </div>

                <div class="g1">
                    <label for="nombre">Nombre de usuario</label>
                    <input type="text" id="nombre" placeholder="Ejemplo: CamCalaf" required>
                </div>

                <button type="submit" class="botonregistro">Registrarse</button>
            </form>
            
            <hr class="separador">

            <footer class="registro">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </footer>
        </section>
        
    </main>
    
</body>
</html>
