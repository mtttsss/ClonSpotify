<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENJI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="contenedor">

        <aside class="barra">
            <a href="index.html">
                <img src="tenji.png" alt="logo" class="logosuperior">
            </a>
            <button class="btn-hamburguesa" id="btnHamburguesa" aria-label="Abrir menú" aria-expanded="false">☰</button>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="biblioteca.html">Tu Biblioteca</a></li>
                    <li><a href="perfil.html">Mi perfil</a></li>
                    <li><a class="activo" href="dashboard.html" aria-current="page">Dashboard</a></li>
                    <li><a href="configuracion.html">Configuracion</a></li>
                </ul>
            </nav>
        </aside>


        <main class="principal">

            <div class="barra-superior">
                <div class="buscador">
                    <span>🔍</span>
                    <input type="text" id="input-buscador" placeholder="Buscar">
                </div>

                <div class="contenedor-dropdown">
                    <button id="btnPerfil" class="btn-perfil">
                        Mi Cuenta ▼
                    </button>

                    <div id="menuPerfil" class="menu-desplegable oculto">
                        <a href="perfil.html">Mi Perfil</a>
                        <hr>
                        <a href="#" id="btnCerrarSesion" class="texto-rojo">Cerrar Sesión</a>
                    </div>
                </div>

                <a href="login.html" class="botonlogin" id="btnIrLogin">INICIAR SESION</a>
            </div>

            <h1 class="dash-titulo">Panel de Control</h1>
            <p class="dash-subtitulo">Estadísticas del catálogo y tus playlists en TENJI</p>
            <p id="estado-dashboard" class="dash-subtitulo" aria-live="polite"></p>

            <section class="dash-seccion">
                <h2 class="dash-seccion-titulo">Resumen del catálogo</h2>
                <div class="dash-grid-stats" id="dash-stats"></div>
            </section>

            <section class="dash-seccion">
                <h2 class="dash-seccion-titulo">Artistas con Más Canciones</h2>
                <div class="dash-lista-artistas" id="dash-artistas"></div>
            </section>

            <section class="dash-seccion">
                <h2 class="dash-seccion-titulo">Canciones Más Largas</h2>
                <div class="dash-grid-canciones" id="dash-canciones"></div>
            </section>


        </main>


        <footer class="reproductor">
            <div class="info-cancion">
                <img src="https://via.placeholder.com/50" alt="Portada de la canción">
                <div class="detalles-cancion">
                    <h4 class="reproductorTitulo">Nombre de la Canción</h4>
                    <p class="reproductorArtista">Artista</p>
                </div>
                <button class="like">♡</button>
            </div>

            <div class="controles-centrales">
                <div class="botones">
                    <button class="anterior">⏮</button>
                    <button class="play">▶</button>
                    <button class="siguiente">⏭</button>
                </div>
                <div class="duracion">
                    <span class="tiempo-actual">0:00</span>
                    <input type="range" class="barra-progreso" min="0" max="100" value="0">
                    <span class="tiempo-total">3:30</span>
                </div>
            </div>

            <div class="volumen">
                <span>🔊</span>
                <input type="range" class="barra-volumen" min="0" max="100" value="50">
            </div>
        </footer>

    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>

</html>
