<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENJI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="contenedor">

        <aside class="barra">
            <img src = "tenji.png" alt = "logo" class = "logosuperior">
            <button class="btn-hamburguesa" id="btnHamburguesa" aria-label="Abrir menú" aria-expanded="false">☰</button>
            <nav>
                <ul>
                    <li><a class="activo" href="index.html">Inicio</a></li>
                    <li><a href="biblioteca.html">Tu Biblioteca</a></li>
                    <li><a href="perfil.html">Mi perfil</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="configuracion.html">Configuracion</a></li>
                </ul>
            </nav>
        </aside>

        <main class="principal">

            <div class="barra-superior">
                <div class="buscador">
                    <span>🔍</span>
                    <input type="text" id="input-buscador" placeholder="Buscar">
                </div>

                <div class="contenedor-dropdown">
                    <button id="btnPerfil" class="btn-perfil">
                        Mi Cuenta ▼
                    </button>

                    <div id="menuPerfil" class="menu-desplegable oculto">
                        <a href="perfil.html">Mi Perfil</a>
                        <hr>
                        <a href="#" id="btnCerrarSesion" class="texto-rojo">Cerrar Sesión</a>
                    </div>
                </div>

                <a href="login.html" class="botonlogin" id="btnIrLogin">INICIAR SESION</a>
            </div>



            <h1>Bienvenido a TENJI</h1>

            <p>Explora tu música favorita y descubre nuevas canciones</p>

            <section class="albumes seccion-espaciada" id="albumes-populares">
                <div id="estado-albumes" role="status" aria-live="polite"></div>
                <h2>Álbumes Populares</h2>


                <div class="orden-portadas" id="contenedor-albumes-populares">

                </div>
            </section>

            <section class="albumes" id="albumes-recomendados">
                <h2>Álbumes Recomendados</h2>
                <div class="orden-portadas" id="contenedor-albumes-recomendados">
            
                </div>
            </section>

            <section class="albumes seccion-espaciada">
                <h2>Explorar canciones</h2>

                
                <div class="filtros-catalogo">

                    <label for="filtro-genero">Filtrar por género:</label>
                    <select id="filtro-genero">
                        <option value="">Todos los géneros</option>
                        <option value="Alternative Metal">Alternative Metal</option>
                        <option value="Cumbia">Cumbia</option>
                        <option value="Urbano">Urbano</option>
                        <option value="Rap">Rap</option>
                        <option value="Reggaeton">Reggaeton</option>
                        <option value="Rock">Rock</option>
                        <option value="Pop">Pop</option>
                        <option value="Dancehall">Dancehall</option>
                    </select>

                    <label for="ordenar-canciones">Ordenar por:</label>
                    <select id="ordenar-canciones">
                        <option value="">Orden original</option>
                        <option value="titulo">Título (A-Z)</option>
                        <option value="artista">Artista (A-Z)</option>
                        <option value="duracion">Duración (menor a mayor)</option>
                    </select>

                </div>


                <div id="estado-canciones" role="status" aria-live="polite"></div>

                <div class="orden-portadas" id="contenedor-canciones">
                    <!-- Las canciones se cargarán desde los mocks -->
                </div>
            </section>
        </main>

        <footer class="reproductor">


            <div class="info-cancion">
                <img src="https://via.placeholder.com/50" alt="Portada de la canción">
                <div class="detalles-cancion">
                    <h4 class="reproductorTitulo">Nombre de la Canción</h4>
                    <p class="reproductorArtista">Artista</p>
                </div>
                <button class="like">♡</button>
            </div>

            <div class="controles-centrales">
                <div class="botones">
                    <button class="anterior">⏮</button>
                    <button class="play">▶</button>
                    <button class="siguiente">⏭</button>
                </div>
                <div class="duracion">
                    <span class="tiempo-actual">0:00</span>
                    <input type="range" class="barra-progreso" min="0" max="100" value="0">
                    <span class="tiempo-total">3:30</span>
                </div>
            </div>


            <div class="volumen">
                <span>🔊</span>
                <input type="range" class="barra-volumen" min="0" max="100" value="50">
            </div>

        </footer>


    </div>


    <script type="module" src="script.js"></script>
</body>

</html>
